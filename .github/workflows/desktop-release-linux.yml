name: desktop-release-linux

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]
  workflow_dispatch:

jobs:
  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build engine sidecar (PyInstaller onedir)
        run: bash scripts/build_sidecar.sh

      - name: Stage engine for Tauri
        run: |
          python3 scripts/stage_sidecar.py \
            --target linux \
            --source dist/alphaloop-engine \
            --tauri-root apps/desktop/src-tauri
          python3 scripts/verify_engine_resource_layout.py \
            --staged apps/desktop/src-tauri/resources/engine/alphaloop-engine

      - name: Build the deb
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri -- build --bundles deb

      - name: Assert NOTICE is inside the deb
        run: |
          DEB=$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          if [[ -z "$DEB" ]]; then
            echo "no deb was built"
            find apps/desktop/src-tauri/target/release/bundle -maxdepth 3 -type f || true
            exit 1
          fi
          dpkg-deb -c "$DEB" | tee /tmp/deb-contents.txt
          grep -q 'NOTICE' /tmp/deb-contents.txt
