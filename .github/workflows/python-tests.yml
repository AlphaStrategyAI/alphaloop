name: python-tests

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (pytest invokes cargo contract test)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Stub engine bundle for tauri build script (runtime-root contract test)
        working-directory: apps/desktop/src-tauri
        run: |
          mkdir -p resources/engine/alphaloop-engine/_internal
          printf '#!/bin/sh\nexit 0\n' > resources/engine/alphaloop-engine/alphaloop-engine
          chmod +x resources/engine/alphaloop-engine/alphaloop-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run pytest (skip network-marked tests)
        run: python -m pytest -q -m "not network"
