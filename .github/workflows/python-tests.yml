name: python-tests

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]

jobs:
  pytest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system deps (pytest invokes cargo contract test)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - name: Stub engine bundle for tauri build script (runtime-root contract test)
        working-directory: apps/desktop/src-tauri
        run: |
          mkdir -p resources/engine/alphaloop-engine/_internal
          printf '#!/bin/sh\nexit 0\n' > resources/engine/alphaloop-engine/alphaloop-engine
          chmod +x resources/engine/alphaloop-engine/alphaloop-engine
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run pytest (skip network-marked tests)
        run: python -m pytest -q -m "not network"
