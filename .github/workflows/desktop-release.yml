name: desktop-release

# Cuts a draft prerelease when a v* tag is pushed. workflow_dispatch builds the
# installers, runs the Windows test, and does not create a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  linux:
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-release-linux.yml
  macos:
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-release-macos.yml
  windows:
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-release-windows.yml
    with:
      run_e2e: true

  publish:
    needs: [linux, macos, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag to match tauri.conf.json and to be on main
        id: ver
        run: |
          python3 scripts/check_app_version.py --check
          VERSION=$(python3 scripts/check_app_version.py --print)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${VERSION}"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: alphaloop_*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS.txt and release notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SHA=$(python3 scripts/resolve_embedded_sha.py)
          echo "tagged commit $SHA (github.sha=$GITHUB_SHA ref=$GITHUB_REF)"
          shopt -s nullglob
          files=(dist/*.embedded-sha)
          if [[ ${#files[@]} -lt 3 ]]; then
            echo "expected embedded commit files from linux, macos, and windows, found ${#files[@]}"
            exit 1
          fi
          for file in "${files[@]}"; do
            got=$(tr -d '[:space:]' < "$file")
            if [[ "$got" != "$SHA" ]]; then
              echo "$file embeds $got; tagged commit is $SHA"
              exit 1
            fi
          done
          rm -f dist/*.embedded-sha
          python3 scripts/assemble_release_assets.py dist "$VERSION" "$SHA"
          for name in \
            "alphaloop_${VERSION}_linux_amd64.deb" \
            "alphaloop_${VERSION}_macos_arm64.dmg" \
            "alphaloop_${VERSION}_macos_arm64.app.tar.gz" \
            "alphaloop_${VERSION}_windows_x64-setup.exe"
          do
            grep -q "  ${name}\$" dist/SHA256SUMS.txt || {
              echo "SHA256SUMS.txt is missing ${name}"
              exit 1
            }
          done
          echo "SHA256SUMS.txt"
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS.txt
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update the draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "release $tag exists and is not a draft"
              exit 1
            fi
            gh release upload "$tag" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "$tag" --repo "${GITHUB_REPOSITORY}" \
              --draft --prerelease \
              --title "alphaloop ${{ steps.ver.outputs.version }}" \
              --notes-file release-notes.md
          else
            gh release create "$tag" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --prerelease \
              --title "alphaloop ${{ steps.ver.outputs.version }}" \
              --notes-file release-notes.md
          fi
