name: desktop-tauri-rust

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]

jobs:
  cargo-check-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system deps (Tauri / GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      - name: Stub engine bundle resources for tauri build script
        run: |
          mkdir -p resources/engine/alphaloop-engine/_internal
          printf '#!/bin/sh\nexit 0\n' > resources/engine/alphaloop-engine/alphaloop-engine
          chmod +x resources/engine/alphaloop-engine/alphaloop-engine
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test
        run: cargo test
