name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install MkDocs + Material (with retry)
        run: |
          python -m pip install --upgrade pip
          ok=0
          for i in 1 2 3 4 5; do
            if pip install mkdocs mkdocs-material; then
              ok=1
              break
            fi
            echo "Retry $i failed, waiting $((i*5))s..."
            sleep $((i*5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "pip install failed after 5 attempts (PyPI unreachable)"
            exit 1
          fi

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
