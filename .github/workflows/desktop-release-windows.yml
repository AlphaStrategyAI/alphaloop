name: desktop-release-windows

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build engine sidecar (PyInstaller onedir)
        shell: bash
        run: bash scripts/build_sidecar.sh

      - name: Stage engine for Tauri
        shell: bash
        run: |
          python scripts/stage_sidecar.py \
            --target windows \
            --source dist/alphaloop-engine \
            --tauri-root apps/desktop/src-tauri
          python scripts/verify_engine_resource_layout.py \
            --staged apps/desktop/src-tauri/resources/engine/alphaloop-engine

      - name: Build Tauri desktop bundle
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri -- build

      - name: Collect bundle artifacts
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p release-artifacts/windows-${SHORT_SHA}
          shopt -s nullglob
          for f in apps/desktop/src-tauri/target/release/bundle/msi/*.msi; do
            cp "$f" "release-artifacts/windows-${SHORT_SHA}/"
          done
          for f in apps/desktop/src-tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "release-artifacts/windows-${SHORT_SHA}/"
          done
          if ! ls release-artifacts/windows-${SHORT_SHA}/* 1>/dev/null 2>&1; then
            echo "No .msi or NSIS .exe found under target/release/bundle"
            find apps/desktop/src-tauri/target/release/bundle -maxdepth 3 -type f || true
            exit 1
          fi
          ls -la "release-artifacts/windows-${SHORT_SHA}"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: alphaloop-desktop-windows-${{ github.sha }}
          path: release-artifacts/**
          if-no-files-found: error
