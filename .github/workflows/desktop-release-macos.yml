name: desktop-release-macos

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      run_e2e:
        description: Unpack and drive the macOS app from this build
        type: boolean
        default: false

permissions: {}

jobs:
  build-macos-bundle:
    permissions:
      contents: read
    # macos-15 is an Apple Silicon runner. macos-14 is in a GitHub brownout
    # (retires 2026-11-02) and cancels with runner_id 0. The bundle is ad-hoc
    # signed and not notarized.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"

      - name: Check desktop version declarations
        id: ver
        run: |
          python3 scripts/check_app_version.py --check
          echo "version=$(python3 scripts/check_app_version.py --print)" >> "$GITHUB_OUTPUT"

      - name: Require an arm64 host
        run: uname -m | grep -qx arm64

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin

      - name: Confirm the Rust host is Apple Silicon
        run: "rustc -vV | grep -q 'host: aarch64-apple-darwin'"

      - name: Record version and git sha
        run: |
          SHA=$(python3 scripts/resolve_embedded_sha.py)
          echo "embedding commit $SHA"
          ALPHALOOP_GIT_SHA="$SHA" python3 scripts/write_build_info.py
          mkdir -p release-artifacts
          printf '%s\n' "$SHA" > "release-artifacts/alphaloop_${{ steps.ver.outputs.version }}_macos.embedded-sha"

      - name: Build engine sidecar (PyInstaller onedir)
        run: bash scripts/build_sidecar.sh

      - name: Stage engine for Tauri
        run: |
          python3 scripts/stage_sidecar.py \
            --target macos \
            --source dist/alphaloop-engine \
            --tauri-root apps/desktop/src-tauri
          python3 scripts/verify_engine_resource_layout.py \
            --staged apps/desktop/src-tauri/resources/engine/alphaloop-engine

      - name: Build ad-hoc signed arm64 bundle
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npm ci
          npm run tauri -- build --target aarch64-apple-darwin

      - name: Verify arm64 ad-hoc signature and package
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          OUT="release-artifacts"
          mkdir -p "$OUT"
          APP=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -maxdepth 1 | head -1)
          if [[ -z "$APP" ]]; then
            find apps/desktop/src-tauri/target -path '*bundle/macos/*.app' -maxdepth 8 || true
            exit 1
          fi
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          ENGINE="$APP/Contents/Resources/engine/alphaloop-engine/alphaloop-engine"
          test -x "$BIN"
          test -x "$ENGINE"
          echo "app binary: $BIN"
          lipo -archs "$BIN" | grep -qx arm64
          lipo -archs "$ENGINE" | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --deep --strict --verbose=2 "$ENGINE"
          tar -czf "$OUT/alphaloop_${VERSION}_macos_arm64.app.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
          DMG=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -maxdepth 1 2>/dev/null | head -1 || true)
          if [[ -n "$DMG" && -f "$DMG" ]]; then
            cp "$DMG" "$OUT/alphaloop_${VERSION}_macos_arm64.dmg"
          else
            hdiutil create -volname alphaloop -srcfolder "$APP" -ov -format UDZO \
              "$OUT/alphaloop_${VERSION}_macos_arm64.dmg"
          fi
          python3 - "$OUT" "$VERSION" <<'PY'
          import hashlib, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          for name in (
              f"alphaloop_{version}_macos_arm64.dmg",
              f"alphaloop_{version}_macos_arm64.app.tar.gz",
          ):
              path = out / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              sidecar = out / f"{name}.sha256"
              sidecar.write_text(f"{digest}  {name}\n", encoding="utf-8")
              print(sidecar.read_text(), end="")
          PY
          ls -la "$OUT"
          if ! find "$APP" -name NOTICE | grep -q NOTICE; then
            echo "NOTICE is missing from the macOS app bundle"
            find "$APP" -maxdepth 4 -type d || true
            exit 1
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.dmg
          path: release-artifacts/alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.dmg
          if-no-files-found: error

      - name: Upload macOS DMG hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.dmg.sha256
          path: release-artifacts/alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.dmg.sha256
          if-no-files-found: error

      - name: Upload macOS app archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.app.tar.gz
          path: release-artifacts/alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.app.tar.gz
          if-no-files-found: error

      - name: Upload macOS app archive hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.app.tar.gz.sha256
          path: release-artifacts/alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.app.tar.gz.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alphaloop_${{ steps.ver.outputs.version }}_macos.embedded-sha
          path: release-artifacts/alphaloop_${{ steps.ver.outputs.version }}_macos.embedded-sha
          if-no-files-found: error

  macos-e2e:
    needs: build-macos-bundle
    # Push to main / cursor/** builds the bundle and skips this job, same as
    # windows-e2e. Pull requests run it. desktop-release.yml passes run_e2e.
    if: github.event_name == 'pull_request' || inputs.run_e2e
    permissions:
      contents: read
    # macos-15 (arm64). Do not use macos-14: GitHub browns it out and the job
    # cancels with runner_id 0. The .app is ad-hoc signed (APPLE_SIGNING_IDENTITY
    # "-") and not notarized. Official tauri-driver cannot attach to WKWebView
    # (https://v2.tauri.app/develop/tests/webdriver/). The GUI script execs
    # Contents/MacOS after clearing quarantine and sets ALPHALOOP_WEBDRIVER=1
    # so the in-app W3C server listens on 127.0.0.1. A normal launch does not
    # set that variable. `open` is not used: LaunchServices is what shows the
    # unidentified-developer dialog. Keychain prompts are not a reason to skip
    # the job. The archive is the .app tar.gz, not the DMG: the DMG is a
    # read-only wrap of the same bundle.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: App version
        id: ver
        run: echo "version=$(python3 scripts/check_app_version.py --print)" >> "$GITHUB_OUTPUT"

      - name: Require an arm64 host
        run: uname -m | grep -qx arm64

      - name: Download macOS app archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alphaloop_${{ steps.ver.outputs.version }}_macos_arm64.app.tar.gz
          path: installer

      - name: Show the macOS time zone, then use Asia/Shanghai
        run: |
          echo "before: $(date) localtime=$(readlink /etc/localtime || true)"
          if ! sudo systemsetup -settimezone Asia/Shanghai; then
            sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          fi
          echo "after: $(date)"

      - name: Install Selenium 4.51.0
        run: python3 -m pip install selenium==4.51.0

      # Best effort only. An ad-hoc identity can still raise a keychain ACL
      # dialog; the keyring step must get past it or the job fails.
      - name: Unlock the login keychain
        run: |
          keychain="${HOME}/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "" "$keychain" || true
          security set-keychain-settings -lut 7200 "$keychain" || true

      - name: Unpacked app smoke
        timeout-minutes: 15
        env:
          ALPHALOOP_OFFLINE_MARKET_DATA: "1"
        run: |
          version="${{ steps.ver.outputs.version }}"
          archive="$PWD/installer/alphaloop_${version}_macos_arm64.app.tar.gz"
          test -f "$archive"
          unset ALPHALOOP_WEBDRIVER || true
          bash apps/desktop/e2e/macos_installed_smoke.sh "$archive"

      - name: macOS GUI end-to-end
        timeout-minutes: 30
        env:
          ALPHALOOP_OFFLINE_MARKET_DATA: "1"
          ALPHALOOP_MAX_TRIALS: "1"
          ALPHALOOP_E2E_HOLD_RUNNING_SEC: "45"
          ALPHALOOP_REVIEWER: deterministic
          ALPHALOOP_WEBDRIVER: "1"
          TAURI_WEBDRIVER_PORT: "4445"
          PYTHONUNBUFFERED: "1"
        run: |
          version="${{ steps.ver.outputs.version }}"
          archive="$PWD/installer/alphaloop_${version}_macos_arm64.app.tar.gz"
          test -f "$archive"
          python3 apps/desktop/e2e/macos_gui_e2e.py "$archive"

      - name: Publish step summary
        if: always()
        run: |
          if [[ -f e2e-artifacts/summary.md ]]; then
            cat e2e-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-e2e-screenshots
          path: e2e-artifacts/screenshots
          if-no-files-found: warn

      - name: Upload app and engine logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-e2e-logs
          path: e2e-artifacts/logs
          if-no-files-found: warn
