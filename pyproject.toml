[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaloop"
version = "0.5.0"
description = "AI-automated quant research loop — Jeff Dean style 'design loops that prompt your agents'. Honest, verifiable, agent-friendly."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OpenStrategy Team"},
]
keywords = ["quant", "trading", "backtest", "investment", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "pyarrow>=14",
    "yfinance>=0.2.0",
    "pyyaml>=6.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
china = ["akshare>=1.11.0"]
crypto = ["ccxt>=4.0.0"]
openbb = ["openbb>=4.0.0"]
analysis = ["matplotlib>=3.7.0", "seaborn>=0.12.0"]
optimization = ["scikit-optimize>=0.9.0", "optuna>=3.0.0"]
all = [
    "akshare>=1.11.0",
    "ccxt>=4.0.0",
    "openbb>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-optimize>=0.9.0",
    "optuna>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
e2e = [
    "playwright>=1.40",
]

[project.scripts]
alphaloop = "alphaloop.cli.main:main"

[project.urls]
Homepage = "https://github.com/AlphaStrategyAI/alphaloop"
Documentation = "https://github.com/AlphaStrategyAI/alphaloop#readme"
Repository = "https://github.com/AlphaStrategyAI/alphaloop"
Issues = "https://github.com/AlphaStrategyAI/alphaloop/issues"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "N", "W"]
lint.ignore = ["E501", "F401", "F811"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel.force-include]
"src/alphaloop/webui/static/index.html" = "alphaloop/webui/static/index.html"
"src/alphaloop/webui/static/app.js" = "alphaloop/webui/static/app.js"
"src/alphaloop/webui/static/styles.css" = "alphaloop/webui/static/styles.css"
"src/alphaloop/skills/overnight-lab/SKILL.md" = "alphaloop/skills/overnight-lab/SKILL.md"
