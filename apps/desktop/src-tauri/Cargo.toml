[package]
name = "alphaloop-desktop"
version = "0.9.0"
description = "alphaloop local-first research desktop"
edition = "2021"

[lib]
name = "alphaloop_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
libc = "0.2"
sys-locale = "0.3"
keyring-core = "1.0.1"
aes-gcm = "0.10"
argon2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# Release WebView2 leaves the page target silent unless AreDevToolsEnabled is
# set. That flag is compiled in only with this feature, and the Windows GUI
# run drives the same installer the release publishes.
tauri = { version = "2", features = ["devtools"] }
