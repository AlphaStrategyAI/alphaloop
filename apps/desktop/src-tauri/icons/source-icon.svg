<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="alphaloop">
  <defs>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="42" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#07090C"/>
  <rect x="2" y="2" width="1020" height="1020" rx="222" fill="none" stroke="#1E2530" stroke-width="2"/>
  <ellipse cx="512" cy="390" rx="240" ry="200" fill="#5EEAD4" opacity="0.10" filter="url(#bloom)"/>
  <text x="512" y="500" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Serif, Georgia, serif" font-weight="500" font-size="440" fill="#E8EEF5">α</text>
  <!-- confirm node tucked under α -->
  <circle cx="548" cy="560" r="26" fill="#5EEAD4" filter="url(#nodeGlow)"/>
  <!-- loop arc below mark -->
  <path d="M300 720 C390 580 634 580 724 720" fill="none" stroke="#5EEAD4" stroke-width="28" stroke-linecap="round"/>
</svg>
