site_name: alphaloop
site_description: >-
  Local-first overnight research lab. Submit a constrained hypothesis
  before bed; review FOUND / NO_EVIDENCE / INCONCLUSIVE in the morning.
  Does not promise alpha.
site_url: https://alphaloop.github.io/alphaloop/
repo_url: https://github.com/AlphaStrategyAI/alphaloop
repo_name: AlphaStrategyAI/alphaloop

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: emerald
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: emerald
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

