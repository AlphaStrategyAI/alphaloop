site_name: alphaloop
site_description: >-
  Open-source quantitative investment framework — a hybrid DAG loop that
  plans, executes, diagnoses, and reports alpha strategies autonomously.
site_url: https://alphaloop.github.io/alphaloop/
repo_url: https://github.com/AlphaStrategyAI/alphaloop
repo_name: AlphaStrategyAI/alphaloop

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: emerald
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: emerald
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - CLI reference: cli.md
  - WebUI: webui.md
  - Plans:
    - Overnight lab refactor: plans/overnight-research-lab-refactor.md
    - Phase 1 contracts: plans/2026-08-18-overnight-lab-phase1-contracts.md
    - Phase 2 runtime: plans/2026-08-19-overnight-lab-phase2-runtime.md
    - Phase 3 protocol: plans/2026-08-19-overnight-lab-phase3-protocol.md
    - Phase 4 morning Web: plans/2026-08-19-overnight-lab-phase4-morning-web.md
    - Phase 5 .asb: plans/2026-08-19-overnight-lab-phase5-asb.md
    - Phase 6 skill: plans/2026-08-19-overnight-lab-phase6-skill.md
    - Phase 7 iterative protocol: plans/2026-08-19-overnight-lab-phase7-iterative-protocol.md
    - Remaining work: plans/2026-08-19-overnight-lab-remaining-work.md
    - Phase 8 protocol semantics: plans/2026-08-19-overnight-lab-phase8-protocol-semantics.md
    - Phase 9 durability and artifacts: plans/2026-08-19-overnight-lab-phase9-durability-artifacts.md
    - Phase 10 morning submit: plans/2026-08-19-overnight-lab-phase10-morning-submit.md
    - Phase 11 verification: plans/2026-08-19-overnight-lab-phase11-verification.md
    - Hybrid DAG loop: plans/v07-hybrid-loop.md
    - LLM judge: plans/v06-llm-judge.md
    - WebUI: plans/v071-webui.md
  - Requirements:
    - Product positioning: requirements/product-positioning-requirements.md
    - v0.7.2: requirements/v072-requirements.md
    - v0.8: requirements/v08-requirements.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlphaStrategyAI/alphaloop
